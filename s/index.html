<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מערכת שעות — לומדים</title>
<!--
  The whole point of this page is one tap in WhatsApp.

  WhatsApp only turns http(s) into a tappable link, so a `lomdim://` line sits there as plain
  text and the person has to copy the message by hand. This page is the https address that IS
  tappable; it hands the timetable straight to the app.

  The timetable rides in the URL fragment, after the `#`. Fragments are never sent to the
  server — that is how HTTP works — so GitHub never receives anyone's week. The data goes
  from the browser to the app on the same phone and nowhere else.
-->
<style>
  :root { color-scheme: light dark; --bg:#FAF5EF; --card:#fff; --ink:#1C1B1A; --dim:#6B6560; --accent:#9B2C55; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151312; --card:#221F1D; --ink:#F4F0EB; --dim:#A49C95; --accent:#E0789F; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Helvetica Neue",Arial,sans-serif; }
  .card { background:var(--card); border-radius:20px; padding:28px 24px; max-width:380px; width:100%;
          text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 8px; }
  p  { font-size:15px; color:var(--dim); margin:0 0 18px; line-height:1.55; }
  a.btn, button.btn { display:block; width:100%; padding:14px; border-radius:14px; border:0;
        font-size:16px; font-weight:600; text-decoration:none; cursor:pointer; margin-top:10px;
        font-family:inherit; }
  .primary { background:var(--accent); color:#fff; }
  .plain   { background:transparent; color:var(--accent); }
  .hidden  { display:none; }
  .cap { font-size:13px; color:var(--dim); margin-top:16px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">פותח את לומדים…</h1>
  <p id="sub">עוד רגע המערכת תיכנס אצלך.</p>

  <div id="fallback" class="hidden">
    <a class="btn primary" href="https://apps.apple.com/il/app/id6808242504">להורדת לומדים — חינם</a>
    <button class="btn plain" id="again">כבר יש לי את לומדים — לפתוח</button>
    <button class="btn plain" id="copy">העתקת ההודעה במקום</button>
    <p class="cap">אם הפתיחה לא עבדה: מעתיקים, נכנסים ללומדים ← מערכת שעות ← "מערכת ששיתפו איתי".</p>
  </div>
</div>

<script>
(function () {
  // Everything after "#" is the timetable. It never left this phone to get here.
  var payload = location.hash.slice(1);
  var deepLink = payload ? "lomdim://schedule?v=1&d=" + payload : null;

  function open() { if (deepLink) location.href = deepLink; }

  if (!payload) {
    document.getElementById("title").textContent = "אין כאן מערכת שעות";
    document.getElementById("sub").textContent =
      "הקישור חסר את החלק שאחרי הסולמית. בקשו מהשולח לשלוח את ההודעה שוב, במלואה.";
    document.getElementById("fallback").classList.remove("hidden");
    document.getElementById("again").classList.add("hidden");
    document.getElementById("copy").classList.add("hidden");
    return;
  }

  open();

  // If the app had opened, this page would be in the background and the timer would not have
  // run to completion. Still being here after a beat means it is not installed — or the
  // browser refused the scheme — so stop pretending and offer the two ways forward.
  setTimeout(function () {
    document.getElementById("title").textContent = "כמעט שם";
    document.getElementById("sub").textContent = "לומדים לא נפתחה. כנראה היא לא מותקנת כאן.";
    document.getElementById("fallback").classList.remove("hidden");
  }, 1600);

  document.getElementById("again").addEventListener("click", open);

  document.getElementById("copy").addEventListener("click", function (e) {
    var text = "lomdim://schedule?v=1&d=" + payload;
    navigator.clipboard.writeText(text).then(function () {
      e.target.textContent = "הועתק ✓";
    }, function () {
      e.target.textContent = "ההעתקה נכשלה — העתיקו את ההודעה מוואטסאפ";
    });
  });
})();
</script>
</body>
</html>
